name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Fast, reliably-available runners. The release publishes as soon as
  # these three are done rather than waiting on macos-x86_64 below, which
  # has a real history of sitting queued for a long time on GitHub's
  # free-tier Intel Mac runners (a platform-capacity issue, not something
  # this workflow can speed up).
  #
  # Linux targets are musl (fully static), not glibc: a glibc build on
  # ubuntu-latest links against a newer glibc than many real target
  # machines ship (confirmed for real — the first release, built glibc,
  # failed to even start on a stock Debian 12 container with
  # `GLIBC_2.39' not found, since Debian 12 ships 2.36). musl sidesteps
  # this by not depending on the host's glibc at all.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - target: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - target: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: contains(matrix.rust_target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.rust_target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="divisi-${{ matrix.target }}"
          mkdir -p "$out"
          cp target/${{ matrix.rust_target }}/release/divisi "$out/"
          cp target/${{ matrix.rust_target }}/release/divisid "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-mcp "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-gateway "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-agent "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-lsp "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-notch "$out/"
          tar -czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: divisi-${{ matrix.target }}
          path: divisi-${{ matrix.target }}.tar.gz

  # Best-effort: same build, on the slow/scarce runner. Not in `build`'s
  # matrix and not something `release` waits on, so a long Intel-Mac queue
  # never delays the other three platforms going live.
  build-macos-intel:
    runs-on: macos-13
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace --target x86_64-apple-darwin
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="divisi-macos-x86_64"
          mkdir -p "$out"
          cp target/x86_64-apple-darwin/release/divisi "$out/"
          cp target/x86_64-apple-darwin/release/divisid "$out/"
          cp target/x86_64-apple-darwin/release/divisi-mcp "$out/"
          cp target/x86_64-apple-darwin/release/divisi-gateway "$out/"
          cp target/x86_64-apple-darwin/release/divisi-agent "$out/"
          cp target/x86_64-apple-darwin/release/divisi-lsp "$out/"
          cp target/x86_64-apple-darwin/release/divisi-notch "$out/"
          tar -czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: divisi-macos-x86_64
          path: divisi-macos-x86_64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: divisi-linux-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: divisi-macos-arm64
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true

  # Runs whenever the slow Intel-Mac build finishes (independent of how
  # long that took relative to `release` above) and attaches its asset to
  # the release that's already live by then.
  attach-macos-intel:
    needs: [release, build-macos-intel]
    if: ${{ !cancelled() && needs.build-macos-intel.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: divisi-macos-x86_64
          path: artifacts
      - name: Attach asset to existing release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
