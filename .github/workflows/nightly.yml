name: nightly

# Keeps a single rolling pre-release ("nightly") in sync with main, so
# `divisi update --channel nightly` always gets whatever's on HEAD instead
# of waiting for the next tagged version — the "grow as I commit stuff to
# main" channel.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Linux targets are musl (fully static), matching release.yml — see that
  # file's comment for why (a glibc build failed to even start on a real
  # Debian 12 test machine).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
          - target: linux-arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-musl
          - target: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: contains(matrix.rust_target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      # Everything is built static (musl) except the notch: it is a Wayland GUI that links xkbcommon, which a
      # static musl build cannot provide. It is built against the runner's glibc instead, on Ubuntu 22.04 so it
      # still starts on Debian 12 (glibc 2.36).
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.rust_target }}" == *musl ]]; then
            cargo build --release --workspace --exclude divisi-notch --target ${{ matrix.rust_target }}
          else
            cargo build --release --workspace --target ${{ matrix.rust_target }}
          fi
      - name: Build the notch (Linux, glibc)
        if: contains(matrix.rust_target, 'musl')
        run: |
          sudo apt-get install -y -qq pkg-config libxkbcommon-dev libwayland-dev
          cargo build --release -p divisi-notch
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="divisi-${{ matrix.target }}"
          mkdir -p "$out"
          cp target/${{ matrix.rust_target }}/release/divisi "$out/"
          cp target/${{ matrix.rust_target }}/release/divisid "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-mcp "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-gateway "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-agent "$out/"
          cp target/${{ matrix.rust_target }}/release/divisi-lsp "$out/"
          if [[ "${{ matrix.rust_target }}" == *musl ]]; then cp target/release/divisi-notch "$out/"; else cp target/${{ matrix.rust_target }}/release/divisi-notch "$out/"; fi
          tar -czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: divisi-${{ matrix.target }}
          path: divisi-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Rolling tag: drop the previous nightly release+tag first so this
      # push's build cleanly replaces it rather than colliding on asset names.
      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --repo ${{ github.repository }} --yes --cleanup-tag || true

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "nightly (${{ github.sha }})"
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: artifacts/*.tar.gz
          body: |
            Automatically rebuilt from `main` @ ${{ github.sha }}.
            Not a stable release — install with `divisi update --channel nightly --yes` if you want to track development, or use the latest `v*` release for anything else.
