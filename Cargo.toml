[workspace]
resolver = "2"
members = [
    "crates/divisi-core",
    "crates/divisi-protocol",
    "crates/divisi-runtime",
    "crates/divisi-agent-sdk",
    "crates/divisi-cli",
    "crates/divisi-tui",
    "crates/divisi-gateway",
    "crates/divisi-mcp",
    "crates/divisi-lsp",
    "crates/divisi-web",
    "crates/divisi-native-agent",
    "crates/divisi-notch",
    "crates/divisi-brand",
]

[workspace.package]
version = "0.24.0"
edition = "2021"
license = "MIT"
authors = ["Navin B. Ruas <founder@nbr.company>"]
repository = "https://github.com/naviNBRuas/TheDivision"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "process", "time", "fs", "sync"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
crossterm = "0.28"
iced = "0.14"
redis = { version = "0.27", features = ["ahash"] }
tar = "0.4"
age = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
libc = "0.2"

[profile.release]
lto = true
strip = true

# `iced_layershell` 0.19.1 (divisi-notch's Wayland positioning, E30 Phase
# 6) pins `iced_exdevtools = "0.19.1"`, which has a real upstream compile
# bug on this toolchain -- an exhaustive match over winit-core 0.31.0-
# beta.3's now-`#[non_exhaustive]` `NativeKeyCode` enum. 0.20.1 fixes it
# and still targets `iced_program = "0.14"` (verified against its own
# Cargo.toml, same as every other iced 0.14 crate here) -- low-risk patch,
# not a version-surface change. `iced_layershell`'s manifest pins a `0.19.1`
# caret requirement that a bare crates.io version bump can't satisfy (0.x
# semver), so this vendors the real 0.20.1 source (`vendor/`) and patches
# to it by path instead.
[patch.crates-io]
iced_exdevtools = { path = "vendor/iced_exdevtools-0.20.1" }
