[workspace]
resolver = "2"
members = [
    "crates/single-core",
    "crates/single-protocol",
    "crates/single-runtime",
    "crates/single-agent-sdk",
    "crates/single-cli",
    "crates/single-tui",
    "crates/single-mcp",
    "crates/singlecli-mcp",
    "crates/single-lsp",
    "crates/single-web",
    "crates/single-native-agent",
]

[workspace.package]
version = "0.17.6"
edition = "2021"
license = "MIT"
authors = ["Navin B. Ruas <founder@nbr.company>"]
repository = "https://github.com/naviNBRuas/SingleCLI"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "process", "time", "fs", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
crossterm = "0.28"
redis = { version = "0.27", features = ["ahash"] }
tar = "0.4"
age = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[profile.release]
lto = true
strip = true
